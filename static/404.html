<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Pix: page not found</title>
<meta name="robots" content="noindex">
<style>
:root{--ink:#141414;--paper:#fffdf6;--tang:#ff8a1f;--teal-d:#0f5f5f;--lemon:#ffe45c;--peg:#e9d9b8;--hole:#c9b58c;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.55;background-color:var(--peg);background-image:radial-gradient(circle at 50% 50%,var(--hole) 0 3px,transparent 3.5px);background-size:28px 28px}
.card{max-width:520px;border:3px solid var(--ink);border-radius:10px;background:var(--paper);padding:24px;box-shadow:7px 7px 0 var(--ink);text-align:center}
h1{margin:0 0 8px;font-family:"Arial Black","Impact",system-ui,sans-serif;font-size:clamp(30px,8vw,46px);line-height:1.1}
h1 span{color:var(--tang)}
p{margin:0 0 14px}
a{display:inline-block;padding:8px 18px;border:3px solid var(--ink);border-radius:999px;background:var(--lemon);color:var(--ink);font-weight:700;text-decoration:none;box-shadow:3px 3px 0 var(--ink)}
a:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main class="card">
  <h1>Byte could not <span>find</span> that page</h1>
  <p>Byte checked every shelf in the shop. That page is not there.</p>
  <a href="/CodePix/">Back to the shop</a>
</main>
</body>
</html>
