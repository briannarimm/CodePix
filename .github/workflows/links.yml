# Monthly: re-check every cited fact against its live source and every registry link.
# Opens an issue when something fails, because open course sites move.
name: Monthly source check

on:
  schedule:
    - cron: "17 6 3 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet pypdf
      - name: Verify facts and links
        id: verify
        run: |
          set -o pipefail
          { python tools/verify_facts.py --fresh; if [ -f tools/check_links.py ]; then python tools/check_links.py; fi; } 2>&1 | tee report.txt
      - name: Open an issue on failure
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = "The monthly source check failed.\n\n```\n" + fs.readFileSync("report.txt", "utf8").slice(-60000) + "\n```";
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: "Monthly source check failed", body });
